[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-challenge"
version = "0.7.1"
description = "Live telemetry SDK for the Drone Challenge: team estimate upload, ROS2/VRPN forwarders, offline CSV"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
drone-challenge = "drone_challenge.cli:main"
drone-live = "diha_participant.forward:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["diha_participant*", "drone_challenge*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
